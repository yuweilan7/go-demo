syntax = "proto3";
package course.inventory.v1;
option go_package = "go-demo/lessons/m32_framework_source_reading/gen/inventoryv1";
import "google/api/annotations.proto";

// 保留 M31 的方法/字段编号与库存语义，只把 Go 导入路径改为本独立 module，增加 HTTP 映射。
service Inventory {
 rpc Reserve(ReserveRequest) returns (ReserveReply) {
  option (google.api.http) = { post: "/v1/inventory/reserve" body: "*" };
 }
 rpc Inspect(InspectRequest) returns (Stock) {
  option (google.api.http) = { get: "/v1/inventory/{sku}" };
 }
 rpc Watch(stream WatchRequest) returns (stream Stock);
}
// 故障模式只用于课程；调用方不能在生产 API 选择跳过 context 或触发 panic。
enum ProcessingMode {
 NORMAL = 0;
 DROP_CONTEXT_BEFORE_COMMIT = 1;
 PROPAGATE_CONTEXT_BEFORE_COMMIT = 2;
 COMMIT_BEFORE_RESPONSE = 3;
 PANIC_BEFORE_COMMIT = 4;
 PANIC_AFTER_COMMIT = 5;
}
message ReserveRequest { string request_id = 1; string sku = 2; int32 quantity = 3; ProcessingMode mode = 4; }
message ReserveReply { string request_id = 1; int32 remaining = 2; }
message InspectRequest { string sku = 1; }
message Stock { string sku = 1; int32 available = 2; int32 sequence = 3; bytes padding = 4; }
message Conflict { string sku = 1; int32 requested = 2; int32 available = 3; }
message WatchRequest { string run_id = 1; string sku = 2; int32 samples = 3; int32 padding_bytes = 4; }
